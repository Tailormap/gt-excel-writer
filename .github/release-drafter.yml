tag-template: "gt-excel-writer-$NEXT_MINOR_VERSION"
name-template: v$NEXT_MINOR_VERSION 🎁
version-template: "$MAJOR.$MINOR"
sort-by: 'title'

template: |
  # What’s Changed

  $CHANGES

categories:
  - title: '🚀 New features and improvements'
    when:
      labels:
        - 'enhancement'
        - 'feature'
        - 'refactoring'
  - title: '⛓️‍💥 Breaking changes'
    when:
      label: 'breaking'
  - title: '🔨 Security fixes en updates'
    when:
      labels:
        - 'security'
  - title: '🐛 Bug Fixes'
    when:
      labels:
        - 'bug'
        - 'fix'
        - 'bugfix'
        - 'regression'
  - title: '📖 Documentation updates'
    when:
      labels:
        - 'documentation'
  - title: '🚨 Removed / ⚠️ Deprecated'
    when:
      labels:
        - 'removed'
        - 'deprecated'
  - title: '🚦 Tests and Infrastructure'
    when:
      labels:
        - 'tests'
        - 'infrastructure'
    collapse-after: 10
  - title: '🔨 Dependency updates'
    when:
      labels:
        - 'dependency'
        - 'dependencies'
    collapse-after: 10

replacers:
  - search: '/CVE-(\d{4})-(\d+)/g'
    replace: '[CVE-$1-$2](https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-$1-$2)'
  - search: '/HTM-(\d+)/g'
    replace: '[HTM-$1](https://b3partners.atlassian.net/browse/HTM-$1)'
  - search: '/EK-(\d+)/g'
    replace: '[EK-$1](https://b3partners.atlassian.net/browse/EK-$1)'
  - search: '/EO-(\d+)/g'
    replace: '[EO-$1](https://b3partners.atlassian.net/browse/EO-$1)'
